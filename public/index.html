<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lily Sabine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #111;
      color: #f2f2f2;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .hero {
      flex: 1;
      background: #fff url("dome.jpg") center / cover no-repeat;
      min-height: 70vh;
    }
    .name {
      padding: 2.5rem 1.5rem 3rem;
      text-align: center;
    }
    h1 {
      font-weight: normal;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    p {
      margin-top: 0.75rem;
      color: #999;
      letter-spacing: 0.08em;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="hero" role="img" aria-label="Ornate dome of a Beaux-Arts building"></div>
  <div class="name">
    <h1>Lily Sabine</h1>
    <p>lilysabine.com</p>
  </div>
</body>
</html>
